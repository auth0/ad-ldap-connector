name: Semantic Release
on:
  push:
    branches:
      - beta-*
      - master
jobs:
  Semantic-Release:
    runs-on: windows-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} + ${{ github.event.base_ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@e3d2460bbb42d7710191569f88069044cfb9d8cf #4.2.2
        with:
          fetch-depth: 0
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #4.4.0
        with:
          node-version-file: .nvmrc
      - name: Application Dependencies
        run: |
          npm ci
      - name: Semantic Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.ref }}" -eq "refs/heads/master") {
            npx semantic-release
            $packageVersion = $(node -e "console.log(require('./package.json').version);")
          } else {
            # Dry run on non-master branches: extract version without creating a tag
            $output = npx semantic-release --dry-run 2>&1 | Out-String
            Write-Host $output
            $versionMatch = [regex]::Match($output, 'next release version is (\S+)')
            if ($versionMatch.Success) {
              $rawVersion = $versionMatch.Groups[1].Value
              # Transform A.B.C-branch-name.D -> A.B.C.D
              $semverMatch = [regex]::Match($rawVersion, '^(\d+\.\d+\.\d+)-(.+)\.(\d+)$')
              if ($semverMatch.Success) {
                # MMddHHmm format to ensure unique version for each build
                # This isn't as nice as having full timestamp but we just need to differentiate between 
                # beta builds (which are only relevant in small time periods) and don't want to exceed npm version limits
                $packageVersion = "$($semverMatch.Groups[1].Value).$(Get-Date -Format 'MMddHHmm')"
              } else {
                $packageVersion = $rawVersion
              }
              $pkg = Get-Content package.json -Raw | ConvertFrom-Json
              $pkg.version = $packageVersion
              $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json
            } else {
              $packageVersion = "0.0.0"
            }
          }
          echo "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_OUTPUT
          echo "Release version is $packageVersion"
        shell: pwsh
      - name: Installer Dependencies
        env:
          PACKAGE_VERSION: ${{ steps.semantic_release.outputs.PACKAGE_VERSION }}
        if: ${{ steps.semantic_release.outputs.PACKAGE_VERSION != '0.0.0' }}
        run: |
          $packageVersion = $env:PACKAGE_VERSION
          echo "Release version is $packageVersion"
          choco install wixtoolset
          cd installer
          Import-Module "$env:ChocolateyInstall/helpers/chocolateyInstaller.psm1"
          refreshenv
        shell: pwsh
      - name: Build Installer
        if: ${{ steps.semantic_release.outputs.PACKAGE_VERSION != '0.0.0' }}
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
          PACKAGE_VERSION: ${{ steps.semantic_release.outputs.PACKAGE_VERSION }}
        run: |
          $packageVersion = $env:PACKAGE_VERSION
          echo "Release version is $packageVersion"
          cd installer
          ./build.ps1
          mv output/adldap.msi "output/adldap-v$packageVersion.msi"
          ls output
        shell: pwsh
      - name: Publish Github Release (only master)
        if: ${{ steps.semantic_release.outputs.PACKAGE_VERSION != '0.0.0' && github.ref == 'refs/heads/master' }}
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
          PACKAGE_VERSION: ${{ steps.semantic_release.outputs.PACKAGE_VERSION }}
        run: |
          $packageVersion = $env:PACKAGE_VERSION
          echo "Release version is $packageVersion"
          gh release upload "v$packageVersion" "installer/output/adldap-v$packageVersion.msi"
        shell: pwsh
      - name: Upload Installer Artifact (non-master)
        if: ${{ steps.semantic_release.outputs.PACKAGE_VERSION != '0.0.0' && github.ref != 'refs/heads/master' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #4.6.2
        with:
          name: adldap-v${{ steps.semantic_release.outputs.PACKAGE_VERSION }}
          path: installer/output/adldap-v${{ steps.semantic_release.outputs.PACKAGE_VERSION }}.msi
          retention-days: 2
